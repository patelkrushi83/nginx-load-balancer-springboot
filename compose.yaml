services:
  backend1:
    build: .
    container_name: spring-backend-1
    environment:
      SERVER_PORT: 8081
    expose:
      - "8081"

  backend2:
    build: .
    container_name: spring-backend-2
    environment:
      SERVER_PORT: 8082
    expose:
      - "8082"

  nginx:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2